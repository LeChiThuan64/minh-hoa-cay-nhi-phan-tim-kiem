<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" role="img" aria-label="Cây nhị phân tìm kiếm động" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <radialGradient id="nodeP" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
    <radialGradient id="nodeB" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <radialGradient id="nodeG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .edge { stroke: url(#edge); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 3s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 200; opacity: .2; } 35%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -200; opacity: .2; } }
    .node { animation: bounce 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.12); } }
    .ring { fill: none; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    .num { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .title { font: 800 22px 'Segoe UI', Arial, sans-serif; text-anchor: middle; fill: url(#edge); animation: tw 2.5s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    .star { fill: #fff; animation: twinkle 2s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; }
    .d4 { animation-delay: .75s; } .d5 { animation-delay: 1s; } .d6 { animation-delay: 1.25s; } .d7 { animation-delay: 1.5s; }
  </style>

  <rect width="700" height="320" rx="20" fill="url(#bg)"/>

  <circle class="star" cx="40" cy="40" r="2"/>
  <circle class="star d3" cx="120" cy="25" r="1.5"/>
  <circle class="star d5" cx="260" cy="30" r="2"/>
  <circle class="star d2" cx="440" cy="22" r="1.5"/>
  <circle class="star d6" cx="600" cy="38" r="2"/>
  <circle class="star d4" cx="665" cy="90" r="1.5"/>
  <circle class="star d7" cx="30" cy="170" r="2"/>
  <circle class="star d1" cx="670" cy="200" r="2"/>
  <circle class="star d3" cx="60" cy="290" r="1.5"/>
  <circle class="star d5" cx="640" cy="295" r="2"/>

  <text class="title" x="350" y="30">Binary Search Tree</text>

  <g>
    <line class="edge" x1="350" y1="88" x2="200" y2="150"/>
    <line class="edge d2" x1="350" y1="88" x2="500" y2="150"/>
    <line class="edge d3" x1="200" y1="150" x2="125" y2="228"/>
    <line class="edge d4" x1="200" y1="150" x2="275" y2="228"/>
    <line class="edge d5" x1="500" y1="150" x2="425" y2="228"/>
    <line class="edge d6" x1="500" y1="150" x2="575" y2="228"/>
  </g>

  <g filter="url(#glow)">
    <g class="node d1"><circle class="ring" cx="350" cy="75" r="22" stroke="#a855f7"/><circle cx="350" cy="75" r="22" fill="url(#nodeP)"/><text class="num" x="350" y="75">50</text></g>
    <g class="node d2"><circle class="ring d2" cx="200" cy="140" r="22" stroke="#3b82f6"/><circle cx="200" cy="140" r="22" fill="url(#nodeB)"/><text class="num" x="200" y="140">30</text></g>
    <g class="node d3"><circle class="ring d3" cx="500" cy="140" r="22" stroke="#3b82f6"/><circle cx="500" cy="140" r="22" fill="url(#nodeB)"/><text class="num" x="500" y="140">70</text></g>
    <g class="node d4"><circle class="ring d4" cx="125" cy="215" r="22" stroke="#22c55e"/><circle cx="125" cy="215" r="22" fill="url(#nodeG)"/><text class="num" x="125" y="215">20</text></g>
    <g class="node d5"><circle class="ring d5" cx="275" cy="215" r="22" stroke="#22c55e"/><circle cx="275" cy="215" r="22" fill="url(#nodeG)"/><text class="num" x="275" y="215">40</text></g>
    <g class="node d6"><circle class="ring d6" cx="425" cy="215" r="22" stroke="#22c55e"/><circle cx="425" cy="215" r="22" fill="url(#nodeG)"/><text class="num" x="425" y="215">60</text></g>
    <g class="node d7"><circle class="ring d7" cx="575" cy="215" r="22" stroke="#22c55e"/><circle cx="575" cy="215" r="22" fill="url(#nodeG)"/><text class="num" x="575" y="215">80</text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
